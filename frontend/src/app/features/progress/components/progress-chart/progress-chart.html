<div class="overflow-x-auto" aria-label="Grafikon prosečne težine i umora po nedeljama">
  <div class="relative min-w-[620px]">
  <svg class="h-72 w-full" viewBox="0 0 700 280" role="img">
    <title>Prosečna težina i umor po nedeljama na skali od 1 do 10</title>

    @for (value of gridLines; track value) {
      <line x1="40" x2="660" [attr.y1]="gridY(value)" [attr.y2]="gridY(value)" stroke="#334155" stroke-width="1" stroke-dasharray="4 5" />
      <text x="25" [attr.y]="gridY(value) + 4" fill="#64748b" font-size="11" text-anchor="middle">{{ value }}</text>
    }

    @if (points().length > 1) {
      <polyline [attr.points]="difficultyLine()" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <polyline [attr.points]="fatigueLine()" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    }

    @for (point of points(); track point.weekLabel) {
      <g
        tabindex="0"
        role="button"
        [attr.aria-label]="point.weekLabel + ': prosečna težina ' + point.difficulty + ', prosečan umor ' + point.fatigue"
        (mouseenter)="showTooltip(point)"
        (mouseleave)="hideTooltip()"
        (focus)="showTooltip(point)"
        (blur)="hideTooltip()"
      >
        <rect [attr.x]="point.x - 32" y="25" width="64" height="215" fill="transparent" />
        <circle [attr.cx]="point.x" [attr.cy]="point.difficultyY" r="6" fill="#f97316" stroke="#0f172a" stroke-width="3" />
        <circle [attr.cx]="point.x" [attr.cy]="point.fatigueY" r="6" fill="#2dd4bf" stroke="#0f172a" stroke-width="3" />
      </g>
    }

    @for (position of weekPositions(); track position.label) {
      <text [attr.x]="position.x" y="258" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="middle">{{ position.label }}</text>
    }
  </svg>

  @if (hoveredPoint(); as point) {
    <div
      class="pointer-events-none absolute top-3 z-10 min-w-40 rounded-xl border border-slate-700 bg-slate-950/95 p-3 text-xs shadow-2xl shadow-black/40"
      [style.left.%]="(point.x / 700) * 100"
      [style.transform]="tooltipTransform(point)"
      role="tooltip"
    >
      <p class="font-black text-white">Nedelja {{ point.index + 1 }}</p>
      <p class="mt-0.5 text-[11px] text-slate-400">{{ point.dateRange }}</p>
      <p class="mt-2 flex items-center justify-between gap-4 text-slate-300"><span>Težina</span><strong class="text-orange-400">{{ point.difficulty.toFixed(1) }}/10</strong></p>
      <p class="mt-1 flex items-center justify-between gap-4 text-slate-300"><span>Umor</span><strong class="text-teal-400">{{ point.fatigue.toFixed(1) }}/10</strong></p>
    </div>
  }
  </div>
</div>

<div class="mt-2 flex flex-wrap items-center justify-center gap-5 text-xs font-semibold text-slate-300">
  <span class="inline-flex items-center gap-2"><span class="size-2.5 rounded-full bg-orange-500"></span>Prosečna težina</span>
  <span class="inline-flex items-center gap-2"><span class="size-2.5 rounded-full bg-teal-400"></span>Prosečan umor</span>
</div>
