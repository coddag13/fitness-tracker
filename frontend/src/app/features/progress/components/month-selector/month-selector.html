<fieldset>
  <legend class="mb-2 block text-xs font-bold uppercase tracking-widest text-slate-400">Izaberi mesec</legend>
  <div class="grid grid-cols-[1fr_auto] gap-2">
    <label class="sr-only" for="progress-month">Mesec</label>
    <select
      id="progress-month"
      [ngModel]="selectedMonth()"
      (ngModelChange)="changeMonth($event)"
      class="rounded-xl border border-slate-700 bg-slate-900 px-4 py-3 text-sm font-semibold text-white transition hover:border-slate-600 focus:border-orange-500"
    >
      @for (month of months; track month; let index = $index) {
        <option [ngValue]="index + 1" [disabled]="monthDisabled(index + 1)">{{ month }}</option>
      }
    </select>

    <label class="sr-only" for="progress-year">Godina</label>
    <select
      id="progress-year"
      [ngModel]="selectedYear()"
      (ngModelChange)="changeYear($event)"
      class="rounded-xl border border-slate-700 bg-slate-900 px-4 py-3 text-sm font-semibold text-white transition hover:border-slate-600 focus:border-orange-500"
    >
      @for (year of years(); track year) {
        <option [ngValue]="year">{{ year }}.</option>
      }
    </select>
  </div>
</fieldset>
