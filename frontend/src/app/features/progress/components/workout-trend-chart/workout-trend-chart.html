<div class="overflow-x-auto" aria-label="Grafikon težine i umora za svaki trening u odabranoj nedelji">
  <div class="relative" [style.min-width.px]="chartWidth()">
    <svg class="h-72 w-full" [attr.viewBox]="'0 0 ' + chartWidth() + ' 280'" role="img">
      <title>Promena težine i umora od treninga do treninga</title>

      @for (value of gridLines; track value) {
        <line x1="40" [attr.x2]="chartWidth() - 40" [attr.y1]="gridY(value)" [attr.y2]="gridY(value)" stroke="#334155" stroke-width="1" stroke-dasharray="4 5" />
        <text x="25" [attr.y]="gridY(value) + 4" fill="#64748b" font-size="11" text-anchor="middle">{{ value }}</text>
      }

      @if (points().length > 1) {
        <polyline [attr.points]="difficultyLine()" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        <polyline [attr.points]="fatigueLine()" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      }

      @for (point of points(); track point.workout.id) {
        <g
          tabindex="0"
          role="button"
          [attr.aria-label]="point.typeLabel + ', ' + point.dateLabel + ' ' + point.timeLabel + ': težina ' + point.workout.difficulty + ', umor ' + point.workout.fatigue"
          (mouseenter)="showTooltip(point)"
          (mouseleave)="hideTooltip()"
          (focus)="showTooltip(point)"
          (blur)="hideTooltip()"
        >
          <rect [attr.x]="point.x - 35" y="25" width="70" height="215" fill="transparent" />
          <circle [attr.cx]="point.x" [attr.cy]="point.difficultyY" r="6" fill="#f97316" stroke="#0f172a" stroke-width="3" />
          <circle [attr.cx]="point.x" [attr.cy]="point.fatigueY" r="6" fill="#2dd4bf" stroke="#0f172a" stroke-width="3" />
          <text [attr.x]="point.x" y="254" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">{{ point.dateLabel }}</text>
          <text [attr.x]="point.x" y="269" fill="#64748b" font-size="10" text-anchor="middle">{{ point.timeLabel }}</text>
        </g>
      }
    </svg>

    @if (hoveredPoint(); as point) {
      <div
        class="pointer-events-none absolute top-3 z-10 min-w-44 rounded-xl border border-slate-700 bg-slate-950/95 p-3 text-xs shadow-2xl shadow-black/40"
        [style.left.%]="(point.x / chartWidth()) * 100"
        [style.transform]="tooltipTransform(point)"
        role="tooltip"
      >
        <p class="font-black text-white">{{ point.typeLabel }}</p>
        <p class="mt-0.5 text-[11px] text-slate-400">{{ point.dateLabel }} u {{ point.timeLabel }}</p>
        <p class="mt-2 flex items-center justify-between gap-4 text-slate-300"><span>Težina</span><strong class="text-orange-400">{{ point.workout.difficulty }}/10</strong></p>
        <p class="mt-1 flex items-center justify-between gap-4 text-slate-300"><span>Umor</span><strong class="text-teal-400">{{ point.workout.fatigue }}/10</strong></p>
      </div>
    }
  </div>
</div>

<div class="mt-2 flex flex-wrap items-center justify-center gap-5 text-xs font-semibold text-slate-300">
  <span class="inline-flex items-center gap-2"><span class="size-2.5 rounded-full bg-orange-500"></span>Težina treninga</span>
  <span class="inline-flex items-center gap-2"><span class="size-2.5 rounded-full bg-teal-400"></span>Umor posle treninga</span>
</div>
