<button
  type="button"
  (click)="selectedChange.emit()"
  class="relative w-full rounded-2xl border p-5 text-left transition"
  [class.border-orange-500]="selected()"
  [class.bg-orange-500/10]="selected()"
  [class.shadow-lg]="selected()"
  [class.shadow-orange-950/20]="selected()"
  [class.border-slate-800]="!selected()"
  [class.bg-slate-900/70]="!selected()"
  [class.hover:border-slate-700]="!selected()"
  [attr.aria-pressed]="selected()"
>
  <span class="flex items-start justify-between gap-3">
    <span>
      <span class="block text-xs font-black uppercase tracking-widest" [class.text-orange-400]="selected()" [class.text-slate-500]="!selected()">
        Nedelja {{ weekNumber() }}
      </span>
      <span class="mt-1 block text-sm font-semibold text-slate-200">
        {{ formatDate(week().weekStart) }} – {{ formatDate(week().weekEnd) }}
      </span>
    </span>
    @if (selected()) {
      <span class="grid size-7 place-items-center rounded-full bg-orange-500 text-sm font-black text-white" aria-hidden="true">✓</span>
    }
  </span>

  <span class="mt-5 grid grid-cols-2 gap-3">
    <span>
      <span class="block text-2xl font-black text-white">{{ week().workoutCount }}</span>
      <span class="text-xs text-slate-500">treninga</span>
    </span>
    <span>
      <span class="block text-2xl font-black text-sky-400">{{ week().totalDurationMinutes }}</span>
      <span class="text-xs text-slate-500">minuta</span>
    </span>
  </span>

  @if (selected()) {
    <span class="absolute -bottom-2 left-1/2 size-4 -translate-x-1/2 rotate-45 border-b border-r border-orange-500 bg-[#20140f]" aria-hidden="true"></span>
  }
</button>
