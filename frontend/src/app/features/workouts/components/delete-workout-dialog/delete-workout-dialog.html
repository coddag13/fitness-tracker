<div class="fixed inset-0 z-[70] grid place-items-center bg-slate-950/80 px-5 py-8 backdrop-blur-sm" role="presentation" (click)="cancelled.emit()">
  <section
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="delete-dialog-title"
    aria-describedby="delete-dialog-description"
    class="w-full max-w-md rounded-2xl border border-slate-700 bg-slate-900 p-6 shadow-2xl shadow-black/50"
    (click)="$event.stopPropagation()"
  >
    <div class="grid size-12 place-items-center rounded-xl bg-red-500/10 text-xl text-red-400" aria-hidden="true">!</div>
    <h2 id="delete-dialog-title" class="mt-5 text-xl font-black text-white">Obrisati trening?</h2>
    <p id="delete-dialog-description" class="mt-2 text-sm leading-6 text-slate-400">
      {{ workoutLabel() }} trening će biti trajno uklonjen. Ovu radnju nije moguće poništiti.
    </p>

    <div class="mt-7 flex justify-end gap-3">
      <button
        type="button"
        (click)="cancelled.emit()"
        [disabled]="deleting()"
        class="rounded-xl border border-slate-700 px-4 py-2.5 text-sm font-bold text-slate-300 transition hover:bg-slate-800 disabled:opacity-50"
      >
        Odustani
      </button>
      <button
        type="button"
        (click)="confirmed.emit()"
        [disabled]="deleting()"
        class="inline-flex items-center gap-2 rounded-xl bg-red-500 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-red-400 disabled:opacity-50"
      >
        @if (deleting()) {
          <span class="size-4 animate-spin rounded-full border-2 border-white/30 border-t-white" aria-hidden="true"></span>
          Brisanje...
        } @else {
          Obriši
        }
      </button>
    </div>
  </section>
</div>
