<div class="relative min-h-dvh overflow-x-hidden bg-slate-950 text-slate-100">
  <div
    class="pointer-events-none fixed inset-0 bg-[radial-gradient(circle_at_top_right,rgba(249,115,22,0.10),transparent_30%),radial-gradient(circle_at_bottom_left,rgba(14,165,233,0.06),transparent_28%)]"
    aria-hidden="true"
  ></div>

  <aside
    class="fixed inset-x-0 bottom-0 z-50 border-t border-slate-800/90 bg-slate-950/95 px-3 py-2 backdrop-blur-xl lg:inset-y-0 lg:left-0 lg:right-auto lg:flex lg:w-72 lg:flex-col lg:border-r lg:border-t-0 lg:px-5 lg:py-7"
  >
    <a
      routerLink="/dashboard"
      class="mb-10 hidden items-center gap-3 rounded-xl px-2 lg:flex"
      aria-label="FitnessTracker početna stranica"
    >
      <span
        class="grid size-11 place-items-center rounded-xl bg-gradient-to-br from-orange-400 to-orange-600 text-sm font-black tracking-tight text-white shadow-lg shadow-orange-950/40"
      >
        FT
      </span>
      <span>
        <span class="block text-lg font-bold tracking-tight text-white">FitnessTracker</span>
        <span class="block text-xs font-medium text-slate-500">Tvoj napredak, jasno.</span>
      </span>
    </a>

    <app-navigation />

    @if (currentUser(); as user) {
      <div class="mt-auto hidden rounded-2xl border border-slate-800 bg-slate-900/70 p-4 lg:block">
        <div class="flex min-w-0 items-center gap-3">
          <span class="grid size-10 shrink-0 place-items-center rounded-xl bg-orange-500/15 text-xs font-black text-orange-300">
            {{ initials() }}
          </span>
          <div class="min-w-0">
            <p class="truncate text-sm font-bold text-slate-100">{{ fullName() }}</p>
            <p class="truncate text-xs text-slate-500">{{ user.email }}</p>
          </div>
        </div>
        <button
          type="button"
          (click)="logout()"
          class="mt-4 flex w-full items-center justify-center gap-2 rounded-xl border border-slate-700 px-3 py-2.5 text-sm font-semibold text-slate-300 transition hover:border-red-500/40 hover:bg-red-500/10 hover:text-red-300"
        >
          <span aria-hidden="true">↪</span>
          Odjavi se
        </button>
      </div>
    }
  </aside>

  <div class="relative pb-24 lg:pb-0 lg:pl-72">
    <header
      class="sticky top-0 z-40 flex h-16 items-center justify-between border-b border-slate-800/70 bg-slate-950/80 px-5 backdrop-blur-xl lg:hidden"
    >
      <a routerLink="/dashboard" class="flex items-center gap-2.5" aria-label="FitnessTracker početna stranica">
        <span
          class="grid size-9 place-items-center rounded-lg bg-gradient-to-br from-orange-400 to-orange-600 text-xs font-black text-white"
        >
          FT
        </span>
        <span class="font-bold tracking-tight text-white">FitnessTracker</span>
      </a>
      <div class="relative">
        <button
          type="button"
          (click)="toggleMobileMenu()"
          class="grid size-9 place-items-center rounded-xl bg-orange-500/15 text-xs font-black text-orange-300"
          [attr.aria-expanded]="mobileMenuOpen()"
          aria-label="Otvori korisnički meni"
        >
          {{ initials() }}
        </button>

        @if (mobileMenuOpen() && currentUser(); as user) {
          <div class="absolute top-12 right-0 w-64 rounded-2xl border border-slate-700 bg-slate-900 p-4 shadow-2xl shadow-black/40">
            <p class="truncate text-sm font-bold text-white">{{ fullName() }}</p>
            <p class="mt-1 truncate text-xs text-slate-500">{{ user.email }}</p>
            <button
              type="button"
              (click)="logout()"
              class="mt-4 w-full rounded-xl border border-slate-700 px-3 py-2.5 text-sm font-semibold text-slate-300 transition hover:border-red-500/40 hover:bg-red-500/10 hover:text-red-300"
            >
              Odjavi se
            </button>
          </div>
        }
      </div>
    </header>

    <main class="mx-auto min-h-dvh w-full max-w-7xl px-5 py-7 sm:px-8 lg:px-10 lg:py-10">
      <router-outlet />
    </main>
  </div>
</div>
